<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <meta name="description" content="Meridian product detail — PixelPro ecommerce demo.">
  <title>Product — Meridian | PixelPro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="header">
    <div class="header__inner">
      <a class="logo" href="index.html" aria-label="Meridian home">Meridian</a>
      <div class="header__actions">
        <a class="header__link" href="index.html">Shop</a>
        <a class="cart" href="cart.html" aria-label="Cart, 0 items" data-cart-btn>
          <svg class="cart__icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75">
            <path d="M6 6h15l-1.5 9h-12z"/>
            <circle cx="9" cy="20" r="1.25"/>
            <circle cx="18" cy="20" r="1.25"/>
            <path d="M6 6L5 3H2"/>
          </svg>
          <span class="cart__badge" data-cart-badge aria-hidden="true">0</span>
        </a>
      </div>
    </div>
  </header>

  <main id="main" class="page">
    <nav class="breadcrumbs" aria-label="Breadcrumb">
      <a href="index.html">Shop</a>
      <span aria-hidden="true">/</span>
      <span data-pdp-crumb>Product</span>
    </nav>

    <div class="pdp" data-pdp>
      <p class="page-note" data-pdp-missing hidden>
        Product not found. <a href="index.html">Back to shop</a>
      </p>

      <div class="pdp__layout" data-pdp-content hidden>
        <div class="pdp__gallery">
          <img class="pdp__img" data-pdp-image src="" alt="" width="800" height="1000">
        </div>
        <div class="pdp__info">
          <p class="pdp__category" data-pdp-category></p>
          <h1 class="pdp__title" data-pdp-title></h1>
          <p class="pdp__price" data-pdp-price></p>
          <p class="pdp__desc" data-pdp-desc></p>
          <p class="pdp__details" data-pdp-details></p>

          <form class="pdp__form" data-pdp-form>
            <label class="pdp__qty-label" for="pdp-qty">Quantity</label>
            <div class="qty">
              <button class="qty__btn" type="button" data-qty-minus aria-label="Decrease quantity">−</button>
              <input class="qty__input" id="pdp-qty" name="qty" type="number" min="1" max="20" value="1" data-qty-input>
              <button class="qty__btn" type="button" data-qty-plus aria-label="Increase quantity">+</button>
            </div>
            <button class="btn btn--primary btn--lg" type="submit">Add to cart</button>
          </form>

          <p class="form__success" role="status" aria-live="polite" data-pdp-status hidden>Added to cart.</p>
          <a class="pdp__cart-link" href="cart.html">View cart →</a>
        </div>
      </div>
    </div>
  </main>

  <div class="sr-status" role="status" aria-live="polite" data-status></div>

  <footer class="footer">
    <p><strong>Meridian</strong> — PixelPro ecommerce demo. Photos via <a href="https://unsplash.com" rel="noopener noreferrer">Unsplash</a>.</p>
    <a href="../index.html">Back to PixelPro</a>
  </footer>

  <script src="js/catalog.js"></script>
  <script src="js/cart-store.js"></script>
  <script src="js/product.js"></script>
</body>
</html>
